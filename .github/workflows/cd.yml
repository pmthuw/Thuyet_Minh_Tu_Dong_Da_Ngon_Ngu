name: AURALIS CD

on:
  workflow_run:
    workflows: ["AURALIS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auralis-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend to Docker server
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify database connectivity
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/auralis
          git checkout main
          git pull --ff-only origin main
          test -f .env
          docker compose --env-file .env -f compose.yaml -f compose.admin.yaml up -d --build backend
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health/db > /dev/null; then
              echo 'AURALIS backend and database ready.'
              exit 0
            fi
            sleep 3
          done
          echo 'Deploy failed: /api/health/db is not ready.' >&2
          docker compose --env-file .env -f compose.yaml -f compose.admin.yaml logs --tail=80 backend >&2
          exit 1
          REMOTE
